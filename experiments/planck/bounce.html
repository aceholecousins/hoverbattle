<!doctype html><head><title>Planck.js Bouncing Ball</title><script src=https://cdnjs.cloudflare.com/ajax/libs/planck-js/1.1.0/planck.min.js></script></head><body>
	<script>const pl=planck,world=new pl.World({gravity:pl.Vec2(0,-10)});let x=400,hDrop=180,rBall=10,hBeam=20;const ground=world.createBody();ground.createFixture(pl.Box(100,hBeam/2),{density:0,friction:0,restitution:1}),ground.setPosition(pl.Vec2(0,-hBeam/2));const ball=world.createDynamicBody(pl.Vec2(0,hDrop+rBall));ball.createFixture(pl.Circle(rBall),{density:1,friction:0,restitution:1}),y0=ball.getPosition().y;const dt=1/120;let simulationTime=0;setInterval(()=>{world.step(dt),simulationTime+=dt,ball.getPosition(),ball.getLinearVelocity()},1e3*dt),world.on("begin-contact",t=>{const l=t.getFixtureA().getBody(),e=t.getFixtureB().getBody();if(l===ball||e===ball){const t=ball.getLinearVelocity().length();console.log(`Collision at t=${simulationTime.toFixed(3)}s, velocity=${t.toFixed(2)}m/s`)}y1=ball.getPosition().y,console.log(y1-y0)});</script>


</body></html>
